:root{--coral:#ff7a5c;--coral-d:#e0583b;--ink:#2b3a55;--muted:#5a6680;--paper:#fffdf6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#7ec8f7;overscroll-behavior:none}
body{font:16px/1.4 Fredoka,ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none;opacity:0;transition:opacity .3s}
#hud.on{opacity:1}
.tally{display:flex;flex-direction:column;gap:6px}
#score{align-self:flex-start;font-size:32px;font-weight:700;line-height:1;color:#fff;padding:5px 14px 6px;border-radius:18px;background:rgba(43,58,85,.24);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-shadow:0 2px 0 rgba(43,58,85,.25);font-variant-numeric:tabular-nums;transform-origin:left center}
#score.pop{animation:pop .5s ease-out}
@keyframes pop{35%{transform:scale(1.22)}}
.chip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:3px 11px 3px 6px;border-radius:999px;background:rgba(43,58,85,.24);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-weight:600;font-size:17px;text-shadow:0 1px 0 rgba(43,58,85,.25)}
.chip svg{width:20px;height:20px}
.tools{display:flex;align-items:center;gap:8px}
#hearts{display:flex;gap:3px;margin-right:4px;padding:8px 10px;border-radius:999px;background:rgba(43,58,85,.24);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ht{width:24px;height:22px;fill:#ff6f91;stroke:#fff;stroke-width:2.2;filter:drop-shadow(0 1px 0 rgba(43,58,85,.25));transition:fill .3s}
.ht.off{fill:rgba(255,255,255,.22)}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:0;background:rgba(43,58,85,.24);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib .x{display:none}.ib.off .x{display:inline}.ib.off .w{display:none}.ib.off{opacity:.75}
#bPause.gone{visibility:hidden}
#hud.calm .tools{opacity:0;pointer-events:none}
.tools{transition:opacity .3s}
.ib:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.screen{position:absolute;inset:0;display:none;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top)) 16px 16px}

@media (max-aspect-ratio:1/1){.screen{align-items:center;padding-bottom:34vh}}
.card{background:var(--paper);border-radius:28px;padding:22px 30px 24px;text-align:center;width:min(400px,100%);box-shadow:0 9px 0 rgba(43,58,85,.10),0 24px 48px rgba(20,30,60,.2);animation:rise .4s ease-out both}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
h1{font-size:50px;line-height:1.05;margin:0 0 6px;font-weight:700;text-wrap:balance}

.btn{font:inherit;font-weight:700;font-size:21px;border:0;border-radius:999px;padding:11px 32px;min-height:50px;background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-d);cursor:pointer;transition:transform .08s,box-shadow .08s}

.sw::before{content:"";position:absolute;width:13px;height:13px;border-radius:50%;top:10px;right:8px;background:radial-gradient(circle at 62% 50%,#2b3a55 0 34%,#fff 37%)}
.sw::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;top:-3px;left:9px;background:var(--s);box-shadow:0 0 0 2px #fff}

</style>
</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="Dino Run game scene"></canvas>
  <div id="hud">
    <div class="tally">
      <div id="score" aria-live="off">0</div>
      <div class="chip"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0-10L2.59-3.56 9.51-3.09 4.19 1.36 5.88 8.09 0 4.4-5.88 8.09-4.19 1.36-9.51-3.09-2.59-3.56Z" fill="#ffc93c" stroke="#ffc93c" stroke-width="2.4" stroke-linejoin="round"/></svg><span id="starN">0</span></div>
    </div>
    <div class="tools">
      <div id="hearts" aria-label="Lives"></div>
      <button class="ib" id="bMusic" aria-label="Music on or off"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor"/><circle cx="16.5" cy="16" r="2.6" fill="currentColor"/><path class="x" d="M3.5 3.5l17 17"/></svg></button>
      <button class="ib" id="bSound" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.6 7.6 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5m0-5l-5 5"/></svg></button>
      <button class="ib" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" style="stroke-width:3.2"><path d="M9 6.5v11M15 6.5v11"/></svg></button>
    </div>
  </div>
  <div id="hint">Tap to jump · tap again in the air to double jump</div>

  <div class="screen on" id="sMenu">
    <div class="card">
      <h1>Dino Run</h1>
      <p class="lede">Hop the hurdles, catch the stars.</p>
      <p class="small" id="howto">Tap to jump · tap again in the air to double jump</p>
      <p class="pick" id="pickLbl">Pick your dino</p>
      <div class="skins" id="skins" role="radiogroup" aria-labelledby="pickLbl"></div>
      <button class="btn" id="bPlay">Play</button>
      <p class="best" id="mBest" hidden>Best <b id="mBestN">0</b></p>
    </div>
  </div>
  <div class="screen" id="sPause">
    <div class="card">
      <h2>Paused</h2>
      <div class="row"><button class="btn" id="bResume">Resume</button><button class="btn ghost" id="bRestart">Restart</button></div>
    </div>
  </div>
  <div class="screen" id="sOver">
    <div class="card">
      <h2 id="oTitle">Nice run!</h2>
      <div class="stats">
        <div><b id="oScore">0</b><span>Score</span></div>
        <div><b id="oStars">0</b><span>Stars</span></div>
        <div><b id="oBest">0</b><span>Best</span></div>
      </div>
      <div class="row"><button class="btn" id="bAgain">Play again</button><button class="btn ghost" id="bMenu">Menu</button></div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), game = $('game');
const store = {
  get(k, d) { try { const v = localStorage.getItem('dinorun.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dinorun.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;

// ---------- tuning (world units; the view is at least 480 x 360 units) ----------
const STEP = 1 / 120, GRAV = 2300, JUMP = 780, DJUMP = 640;
const BASE = 280, ACC = 4, MAXS = 500, CYCLE_LEN = 160;
const INK = '#2b3a55';
const SKINS = [
  { id: 'mint',  name: 'Mint',  body: '#5cc48f', dark: '#43a676', belly: '#fff1c4', spike: '#ff8a65', cheek: 'rgba(255,150,172,.85)' },
  { id: 'sky',   name: 'Sky',   body: '#5fb2ef', dark: '#3f91d0', belly: '#fff4d6', spike: '#ffc93c', cheek: 'rgba(255,150,172,.85)' },
  { id: 'sunny', name: 'Sunny', body: '#ffc44d', dark: '#e3a12a', belly: '#fff7e0', spike: '#ff7a5c', cheek: 'rgba(255,120,120,.6)' },
  { id: 'berry', name: 'Berry', body: '#ff8fb3', dark: '#e26c94', belly: '#fff0f5', spike: '#8b6cf0', cheek: 'rgba(230,70,120,.45)' },
  { id: 'grape', name: 'Grape', body: '#a98bf0', dark: '#8869d6', belly: '#f4edff', spike: '#5fd0b0', cheek: 'rgba(255,150,190,.8)' },
  { id: 'coral', name: 'Coral', body: '#ff9a66', dark: '#e57a45', belly: '#fff1dc', spike: '#4fbf8b', cheek: 'rgba(230,80,90,.45)' }
];
let SK = SKINS.find(k => k.id === store.get('skin', 'mint')) || SKINS[0];

let dpr = 1, S = 1, VW = 480, VH = 360, GY = 288, DX = 90, T = 0;
function resize() {
  const w = game.clientWidth || innerWidth, h = game.clientHeight || innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  S = Math.min(h / 360, w / 480); VW = w / S; VH = h / S;
  GY = VH - (VH > 520 ? VH * 0.28 : 72);
  DX = clamp(VW * 0.16, 64, 130);
}

// ---------- scenery palettes: day -> sunset -> night -> dawn ----------
const KEYS = ['top', 'bot', 'far', 'near', 'tree', 'grass', 'dirt', 'dirt2', 'cloud', 'sun'];
const PAL = {
  day:    { top: [120,198,247], bot: [214,240,255], far: [166,214,196], near: [122,198,152], tree: [84,168,110], grass: [112,192,104], dirt: [236,206,152], dirt2: [214,180,124], cloud: [255,255,255], sun: [255,244,194] },
  sunset: { top: [104,118,212], bot: [255,182,140], far: [190,152,198], near: [150,128,186], tree: [108,102,168], grass: [104,162,112], dirt: [226,178,142], dirt2: [200,150,120], cloud: [255,214,204], sun: [255,196,138] },
  night:  { top: [22,30,70],    bot: [58,72,128],   far: [44,58,104],   near: [34,50,90],    tree: [30,62,76],   grass: [44,96,84],   dirt: [92,82,114],  dirt2: [74,64,98],   cloud: [150,160,212], sun: [255,196,138] },
  dawn:   { top: [148,190,240], bot: [255,214,196], far: [186,214,206], near: [146,200,170], tree: [104,168,128], grass: [116,188,118], dirt: [236,202,160], dirt2: [214,178,138], cloud: [255,240,236], sun: [255,214,170] }
};
const CYC = [[0, 'day'], [.38, 'day'], [.46, 'sunset'], [.54, 'night'], [.8, 'night'], [.9, 'dawn'], [1, 'day']];
function palAt(p) {
  let i = 0;
  while (i < CYC.length - 2 && p >= CYC[i + 1][0]) i++;
  const [a, ka] = CYC[i], [b, kb] = CYC[i + 1], t = ease(clamp((p - a) / (b - a), 0, 1)), o = {};
  for (const k of KEYS) { const A = PAL[ka][k], B = PAL[kb][k]; o[k] = `rgb(${lerp(A[0], B[0], t) | 0},${lerp(A[1], B[1], t) | 0},${lerp(A[2], B[2], t) | 0})`; }
  o.night = p < .46 ? 0 : p < .54 ? ease((p - .46) / .08) : p < .8 ? 1 : p < .9 ? 1 - ease((p - .8) / .1) : 0;
  return o;
}

// ---------- sound: everything is synthesized, soft and pentatonic ----------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const Snd = {
  ctx: null, on: store.get('sound', true), music: store.get('music', true),
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.on ? 1 : 0; this.master.connect(c.destination);
      this.sfx = c.createGain(); this.sfx.gain.value = .6; this.sfx.connect(this.master);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2000; lp.connect(this.master);
      this.mus = c.createGain(); this.mus.gain.value = this.music ? .5 : 0; this.mus.connect(lp);
      this.dl = c.createDelay(1); this.dl.delayTime.value = .3;
      const fb = c.createGain(); fb.gain.value = .32; const dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 1800;
      const wet = c.createGain(); wet.gain.value = .35;
      this.dl.connect(dlp); dlp.connect(fb); fb.connect(this.dl); dlp.connect(wet); wet.connect(this.master);
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  },
  note(f, t, d, o = {}) {
    const c = this.ctx; if (!c) return;
    const osc = c.createOscillator(), g = c.createGain(), v = o.vol || .1;
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || d));
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || .008));
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    osc.connect(g); g.connect(o.bus || this.sfx);
    if (o.echo) { const s = c.createGain(); s.gain.value = o.echo; g.connect(s); s.connect(this.dl); }
    osc.start(t); osc.stop(t + d + .05);
  },
  fx(f, d, o) { if (this.ctx && this.on && this.ctx.state === 'running') this.note(f, this.ctx.currentTime + (o && o.at || 0), d, o); },
  jump() { this.fx(392, .17, { to: 660, slide: .1, vol: .13 }); },
  jump2() { this.fx(523, .2, { to: 880, slide: .1, vol: .1, type: 'triangle' }); },
  star(n) {
    const sc = [0, 2, 4, 7, 9, 12, 14, 16, 19], f = 523.25 * Math.pow(2, sc[Math.min(n, sc.length - 1)] / 12);
    this.fx(f, .5, { type: 'triangle', vol: .12, echo: .5 }); this.fx(f * 2, .3, { vol: .025, echo: .3 });
  },
  hit() { this.fx(240, .32, { to: 120, type: 'triangle', vol: .16 }); this.fx(120, .22, { vol: .08 }); },
  tick() { this.fx(330, .08, { vol: .05, type: 'triangle' }); },
  heart() { [523.25, 659.25, 783.99].forEach((f, i) => this.fx(f, .35, { at: i * .08, type: 'triangle', vol: .1, echo: .4 })); },
  mile() { [783.99, 1046.5].forEach((f, i) => this.fx(f, .55, { at: i * .13, vol: .07, echo: .5 })); },
  over() { [523.25, 440, 392, 329.63].forEach((f, i) => this.fx(f, .55, { at: i * .17, type: 'triangle', vol: .1, echo: .4 })); },
  setOn(v) { this.on = v; store.set('sound', v); if (this.ctx) this.master.gain.setTargetAtTime(v ? 1 : 0, this.ctx.currentTime, .05); },
  setMusic(v) { this.music = v; store.set('music', v); if (this.ctx) this.mus.gain.setTargetAtTime(v ? .5 : 0, this.ctx.currentTime, .1); }
};

// a slow, quiet music box: soft pads under a wandering pentatonic tune (C - Am - F - G)
const CHORDS = [[48, 55, 60, 64], [45, 52, 57, 60], [41, 53, 57, 60], [43, 55, 59, 62]];
const PENT = [60, 62, 64, 67, 69, 72, 74, 76, 79];
const RHY = [.8, .12, .4, .2, .7, .12, .45, .1];
const Music = {
  playing: false, next: 0, beat: 0, timer: 0, idx: 4,
  sync() { (Snd.ctx && Snd.on && Snd.music) ? this.start() : this.stop(); },
  start() { if (this.playing) return; this.playing = true; this.next = Snd.ctx.currentTime + .15; this.beat = 0; this.timer = setInterval(() => this.tick(), 120); },
  stop() { this.playing = false; clearInterval(this.timer); },
  tick() {
    const c = Snd.ctx; if (!c || c.state !== 'running') return;
    const e = 60 / 72 / 2;
    if (this.next < c.currentTime) this.next = c.currentTime + .05;
    while (this.next < c.currentTime + .5) { this.play(this.beat, this.next, e); this.next += e; this.beat++; }
  },
  play(b, t, e) {
    const ch = CHORDS[Math.floor(b / 8) % 4], pos = b % 8;
    if (pos === 0) {
      Snd.note(mtof(ch[0] - 12), t, e * 8, { vol: .05, att: .5, bus: Snd.mus });
      for (let i = 1; i < 4; i++) Snd.note(mtof(ch[i]), t, e * 8.5, { vol: .028, att: .9, bus: Snd.mus });
    }
    if (Math.random() < RHY[pos]) {
      if (Math.random() < .3) { const tgt = ch[1 + (Math.random() * 3 | 0)] + 12; let best = 0; PENT.forEach((m, i) => { if (Math.abs(m - tgt) < Math.abs(PENT[best] - tgt)) best = i; }); this.idx = best; }
      else this.idx = clamp(this.idx + [-2, -1, 1, 2][Math.random() * 4 | 0], 0, PENT.length - 1);
      Snd.note(mtof(PENT[this.idx]), t, e * 2.2, { type: 'triangle', vol: .06, bus: Snd.mus, echo: .35 });
    }
  }
};

// ---------- game state ----------
const G = { state: 'menu', dist: 0, time: 0, speed: 70, starPts: 0, stars: 0, lives: 3, best: store.get('best', 0), obs: [], items: [], parts: [], texts: [],
  nextObs: 0, dayP: .06, shake: 0, slow: 0, dieT: 0, overT: 0, combo: 0, comboT: 0, heartT: 0, mile: 0, beatBest: false, hintT: 0, last: '', beeSeen: false };
const D = { h: 0, vy: 0, ground: true, jumps: 0, hold: false, run: 0, sq: 0, inv: 0, hurt: 0, blinkT: 2.5, blink: 0, dustT: 0 };
const score = () => Math.floor(G.dist / 25) + G.starPts;

function reset() {
  Object.assign(G, { dist: 0, time: 0, speed: BASE * .8, starPts: 0, stars: 0, lives: 3, obs: [], items: [], parts: [], texts: [], nextObs: VW * .5 + 220,
    shake: 0, slow: 0, dieT: 0, overT: 0, combo: 0, comboT: 0, heartT: 0, mile: 0, beatBest: false, dayP: .06, last: '', beeSeen: false });
  Object.assign(D, { h: 0, vy: 0, ground: true, jumps: 0, hold: false, sq: 0, inv: 0, hurt: 0 });
  hud(true);
}
const OB = {
  hurdle: { w: 30, tip: true, draw: drawHurdle },
  rock:   { w: 34, h: 26, draw: drawRock },
  cone:   { w: 24, h: 44, tip: true, draw: drawCone },
  hay:    { w: 52, h: 40, draw: drawHay },
  stack:  { w: 52, h: 80, draw: drawHay },
  log:    { w: 66, h: 30, draw: drawLog },
  pot:    { w: 30, h: 50, tip: true, draw: drawPot },
  bee:    { w: 30, h: 22, base: 76, fly: true, draw: drawBee }
};
const obstacle = (type, x, h) => { const k = OB[type], base = k.base || 0; return { type, x, w: k.w, base, h: base + (h || k.h), hit: false, knock: false, kt: 0, rot: 0, ph: Math.random() * TAU }; };
function pickType(t) {
  const pool = [['hurdle', 4], ['rock', 2], ['cone', 2]];
  if (t > 12) pool.push(['hay', 2], ['log', 2], ['pot', 2]);
  if (t > 25) pool.push(['bee', 1.6], ['pair', 1.4]);
  if (t > 35) pool.push(['stack', 1.1]);
  let r = Math.random() * pool.reduce((a, q) => a + q[1], 0);
  for (const [k, wt] of pool) if ((r -= wt) < 0) return k === G.last && k !== 'hurdle' ? 'hurdle' : k;
  return 'hurdle';
}
const item = (x, hy, kind) => ({ x, hy, kind, ph: Math.random() * TAU, gone: false });

function spawnObs() {
  const t = G.time, s = Math.max(G.speed, BASE), type = pickType(t);
  let x = VW + 40, w;
  G.last = type;
  if (type === 'pair') { G.obs.push(obstacle('hurdle', x, 36), obstacle('hurdle', x + 88, 36)); w = 118; }
  else if (type === 'bee') {
    x += s * .35;
    const o = obstacle('bee', x); w = o.w;
    if (!G.beeSeen) { o.label = true; G.beeSeen = true; }
    G.obs.push(o);
    for (const k of [-26, 0, 26]) G.items.push(item(x + 15 + k, 28, 'star'));
  } else {
    const r = Math.random(), h = type === 'hurdle' ? (t < 12 ? (r < .6 ? 36 : 50) : (r < .42 ? 36 : r < .78 ? 50 : 64)) : 0;
    const o = obstacle(type, x, h); w = o.w; G.obs.push(o);
  }
  if (type !== 'bee' && Math.random() < .45) for (const k of [-.17, 0, .17]) G.items.push(item(x + w / 2 + k * s, 158 - .5 * GRAV * k * k, 'star'));
  const gap = s * rnd(.95, 1.8) + (t < 8 ? 140 : 70), after = x + w, roll = Math.random();
  if (G.lives < 3 && G.heartT > 28) { G.items.push(item(after + gap * .45, 60, 'heart')); G.heartT = 0; }
  else if (roll < .32) {
    const n = clamp(Math.floor((gap * .5 - .4 * s) / 28) + 1, 0, 5);
    if (n >= 2) for (let i = 0; i < n; i++) G.items.push(item(after + gap * .4 + i * 28, 28, 'star'));
  } else if (roll < .44 && t > 6) G.items.push(item(after + gap * .45, 205, 'star'));
  G.nextObs = gap + (x - VW - 40) + w - 30;
}

// ---------- effects ----------

}

  ctx.beginPath(); ctx.ellipse(cx + 7, cy - 10, 5, 8 * fl, .7, 0, TAU); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(cx + 13, cy - 2); ctx.lineTo(cx + 19, cy + 1); ctx.lineTo(cx + 13, cy + 4); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, 15, 11, 0, 0, TAU); ctx.save(); ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.clip();
  ctx.fillStyle = INK; ctx.fillRect(cx - 2, cy - 12, 4.5, 24); ctx.fillRect(cx + 6, cy - 12, 4.5, 24);
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 8, cy - 3, 3.6, 0, TAU); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(cx - 9, cy - 3, 2, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,140,160,.8)'; ctx.beginPath(); ctx.arc(cx - 4, cy + 3.5, 2, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx - 9.5, cy + 2.5, 2.6, .3 * Math.PI, .9 * Math.PI); ctx.moveTo(cx - 10, cy - 10); ctx.quadraticCurveTo(cx - 12, cy - 17, cx - 16, cy - 17); ctx.stroke();
  if (o.label && o.x > DX + 10) {
    ctx.font = '700 13px Fredoka, ui-rounded, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(43,58,85,.6)'; ctx.strokeText('Stay low!', cx, cy - 25);
    ctx.fillStyle = '#fff'; ctx.fillText('Stay low!', cx, cy - 25);
  }
}
function drawItem(it) {
  const y = GY - (it.hy + Math.sin(it.ph) * 3);
  const gl = ctx.createRadialGradient(it.x, y, 2, it.x, y, 22), warm = it.kind === 'star' ? '255,220,90' : '255,120,160';
  gl.addColorStop(0, `rgba(${warm},.5)`); gl.addColorStop(1, `rgba(${warm},0)`);
  ctx.fillStyle = gl; ctx.fillRect(it.x - 22, y - 22, 44, 44);
  ctx.save(); ctx.translate(it.x, y);
  if (it.kind === 'star') {
    ctx.rotate(Math.sin(it.ph * .5) * .25);
    starPath(11, 5); ctx.fillStyle = ctx.strokeStyle = '#ffc93c'; ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
    ctx.translate(-1, -1.2); starPath(5.5, 2.4); ctx.fillStyle = '#ffe9a0'; ctx.fill();
  } else {

}
function leg(hx, ang, air) {
  ctx.save(); ctx.translate(hx, -17); ctx.rotate(ang);
  const L = air ? 11 : 15; rr(-3.5, 0, 7, L, 3.5); ctx.fill();
  ctx.beginPath(); ctx.ellipse(2.5, L, 5.5, 3, 0, 0, TAU); ctx.fill(); ctx.restore();
}
function drawDino() {
  const air = !D.ground, ph = D.run, y = GY - D.h, sh = clamp(1 - D.h / 240, .35, 1);
  ctx.fillStyle = 'rgba(30,40,70,.18)'; ctx.beginPath(); ctx.ellipse(DX + 2, GY + 2, 22 * sh, 4.5 * sh, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(DX, y);
  if (D.inv > 0 && Math.floor(D.inv * 10) % 2 === 0) ctx.globalAlpha = .45;
  ctx.scale(1 + D.sq * .6, 1 - D.sq);
  const dying = G.state === 'dying' || G.state === 'over';
  const a1 = air ? -.5 : dying ? .2 : Math.sin(ph) * .75, a2 = air ? .6 : dying ? -.2 : -Math.sin(ph) * .75;
  const bob = air || dying ? 0 : -Math.abs(Math.sin(ph)) * 2.2;
  ctx.fillStyle = SK.dark; leg(-6, a1, air);
  ctx.translate(0, bob);
  const wag = Math.sin(T * 6) * 2 + (air ? -4 : 0);
  ctx.fillStyle = SK.body; ctx.beginPath(); ctx.moveTo(-12, -37); ctx.quadraticCurveTo(-30, -34 + wag * .5, -42, -24 + wag); ctx.quadraticCurveTo(-28, -17, -10, -18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = SK.spike; ctx.beginPath(); circ(-15, -38, 4.2); circ(-6, -42.5, 4.8); circ(3, -43.5, 4.4); circ(8, -59.5, 3.6); circ(15.5, -61.5, 3.3); ctx.fill();
  ctx.fillStyle = SK.body; ctx.beginPath();
  ctx.ellipse(0, -29, 19, 15, 0, 0, TAU); ctx.moveTo(19, -38); ctx.ellipse(9, -38, 10, 9, 0, 0, TAU);
  ctx.moveTo(29, -49); ctx.ellipse(14, -49, 15, 13, 0, 0, TAU); ctx.moveTo(36, -45); ctx.ellipse(25, -45, 11, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = SK.belly; ctx.beginPath(); ctx.ellipse(6, -25, 11, 9.5, -.2, 0, TAU); ctx.fill();
  const arm = air ? -.7 : Math.sin(ph + 1.4) * .4;
  ctx.strokeStyle = SK.dark; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(12, -30); ctx.lineTo(12 + Math.cos(.9 + arm) * 7, -30 + Math.sin(.9 + arm) * 7); ctx.stroke();
  ctx.fillStyle = SK.cheek; ctx.beginPath(); ctx.arc(24, -41, 3.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineCap = 'round';
  if (D.hurt > 0) {
    ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(14, -55); ctx.lineTo(20, -51.5); ctx.lineTo(14, -48); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(30, -41.5, 2.3, 0, TAU); ctx.fill();
  } else {
    if (D.blink > 0) { ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12.5, -52); ctx.quadraticCurveTo(17, -49.5, 21.5, -52); ctx.stroke(); }
    else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(17, -52, 5.8, 0, TAU); ctx.fill();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(19, -52, 3.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(20.2, -53.4, 1.2, 0, TAU); ctx.fill();
    }
    ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(28.5, -44, 4, .25 * Math.PI, .8 * Math.PI); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(43,58,85,.45)'; ctx.beginPath(); ctx.arc(33, -48, 1.1, 0, TAU); ctx.fill();
  ctx.translate(0, -bob); ctx.fillStyle = SK.body; leg(6, a2, air);
  ctx.restore();
}
function drawFx() {
  for (const p of G.parts) {
    const a = clamp(p.life / p.max, 0, 1), y = GY - p.h;
    if (p.k === 'spark') { ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, y); ctx.rotate(p.life * 6 + .785); ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r); ctx.restore(); }
    else { ctx.globalAlpha = a * .75; ctx.fillStyle = p.c === 'd' ? '#fffaf0' : p.c; ctx.beginPath(); ctx.arc(p.x, y, p.r * (1.4 - a * .4), 0, TAU); ctx.fill(); }
  }
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const t of G.texts) {
    ctx.globalAlpha = clamp(t.life / .3, 0, 1); ctx.font = `700 ${t.size}px Fredoka, ui-rounded, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(43,58,85,.55)'; ctx.strokeText(t.s, t.x, GY - t.h);
    ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, GY - t.h);
  }
  ctx.globalAlpha = 1;
}
function render() {
  const P = palAt(G.dayP);
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  if (G.shake > 0 && !reduce) { const k = G.shake / .25 * 3; ctx.translate(rnd(-k, k), rnd(-k, k)); }
  sky(P); land(P);
  for (const o of G.obs) drawObs(o);
  for (const it of G.items) drawItem(it);
  drawDino(); drawFx();
}

// ---------- HUD & screens ----------
const elScore = $('score'), elStars = $('starN'), elHearts = $('hearts'), hs = { s: -1, st: -1, l: -1 };
function hud(force) {
  const s = score();
  if (force || s !== hs.s) { hs.s = s; elScore.textContent = s; }
  if (force || G.stars !== hs.st) { hs.st = G.stars; elStars.textContent = G.stars; }
  if (force || G.lives !== hs.l) {
    hs.l = G.lives;
    elHearts.innerHTML = [0, 1, 2].map(i => `<svg class="ht${i < G.lives ? '' : ' off'}" viewBox="-13 -13 26 23" aria-hidden="true"><path d="M0 7C-12-1-8-12 0-5 8-12 12-1 0 7Z"/></svg>`).join('');
    elHearts.setAttribute('aria-label', G.lives + ' lives');
  }
}
function popScore() { if (reduce) return; elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop'); }
function show(id) {
  for (const s of ['sMenu', 'sPause', 'sOver']) $(s).classList.toggle('on', s === id);
  $('hud').classList.toggle('on', id !== 'sMenu');
  $('bPause').classList.toggle('gone', G.state !== 'play' && G.state !== 'paused');
  $('hud').classList.toggle('calm', !!id);
}
function hint(on) { $('hint').classList.toggle('on', on); G.hintT = on ? 5 : 0; }
function icons() { $('bSound').classList.toggle('off', !Snd.on); $('bMusic').classList.toggle('off', !Snd.music); }
function menuBest() { $('mBest').hidden = !G.best; $('mBestN').textContent = G.best; }

function start() {
  Snd.init(); Music.sync(); reset(); G.state = 'play'; show(null); hint(true);
}
function pause() { if (G.state !== 'play') return; G.state = 'paused'; D.hold = false; show('sPause'); if (Snd.ctx) Snd.ctx.suspend().catch(() => {}); }
function resume() { if (G.state !== 'paused') return; G.state = 'play'; show(null); Snd.init(); }
function gameOver() {
  G.state = 'over'; G.overT = 0;
  const s = score(), isBest = s > G.best;
  if (isBest) { G.best = s; store.set('best', s); }
  $('oTitle').textContent = isBest && s > 0 ? 'New best!' : ['Nice run!', 'Well hopped!', 'Great try!'][Math.random() * 3 | 0];
  $('oScore').textContent = s; $('oStars').textContent = G.stars; $('oBest').textContent = G.best;
  hint(false); show('sOver');
}
function toMenu() { G.state = 'menu'; G.obs = []; G.items = []; G.dayP = .06; Object.assign(D, { h: 0, vy: 0, ground: true, hurt: 0, inv: 0 }); menuBest(); show('sMenu'); }

// ---------- input ----------
let downs = 0;
game.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  Snd.init(); Music.sync();
  if (G.state === 'menu') { if (!e.target.closest('.card')) { e.preventDefault(); start(); } return; }
  if (G.state === 'over') { if (G.overT > 1) start(); return; }
  if (G.state === 'play') { e.preventDefault(); downs++; press(); }
});
const up = () => { downs = Math.max(0, downs - 1); if (!downs) release(); Snd.init(); Music.sync(); };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
game.addEventListener('contextmenu', e => e.preventDefault());
const JUMPKEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  if (JUMPKEYS.includes(e.code)) {
    e.preventDefault(); if (e.repeat) return;
    Snd.init(); Music.sync();
    if (G.state === 'menu' || (G.state === 'over' && G.overT > .6)) start();
    else if (G.state === 'play') press();
    else if (G.state === 'paused') resume();
  } else if (e.code === 'Escape' || e.code === 'KeyP') { G.state === 'play' ? pause() : resume(); }
  else if (e.code === 'KeyM') { Snd.init(); Snd.setOn(!Snd.on); Music.sync(); icons(); }
});
addEventListener('keyup', e => { if (JUMPKEYS.includes(e.code)) release(); });
const tap = (id, f) => $(id).addEventListener('click', e => { e.currentTarget.blur(); f(); });
tap('bPlay', start); tap('bAgain', start); tap('bRestart', start); tap('bResume', resume); tap('bMenu', toMenu);
tap('bPause', () => G.state === 'play' ? pause() : resume());

tap('bMusic', () => { Snd.init(); Snd.setMusic(!Snd.music); Music.sync(); icons(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (Snd.ctx) Snd.ctx.suspend().catch(() => {}); }
  else if (Snd.ctx && G.state !== 'paused') Snd.ctx.resume().catch(() => {});
});
addEventListener('blur', () => pause());
addEventListener('resize', resize);

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .1) dt = .1;
  T += dt;
  if (G.state !== 'paused') { acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; } }
  render();
  if (G.state === 'play' || G.state === 'dying') hud();
  requestAnimationFrame(frame);
}
const elSkins = $('skins');
elSkins.innerHTML = SKINS.map(k => `<button class="sw" role="radio" data-id="${k.id}" aria-label="${k.name} dino" style="--c:${k.body};--d:${k.dark};--b:${k.belly};--s:${k.spike}"></button>`).join('');

elSkins.addEventListener('click', e => {
  const b = e.target.closest('.sw'); if (!b) return;
  SK = SKINS.find(k => k.id === b.dataset.id) || SKINS[0]; store.set('skin', SK.id); markSkin();
  Snd.init(); Music.sync(); Snd.fx(660, .14, { type: 'triangle', vol: .08, to: 880, slide: .08 });

markSkin();
const how = finePointer ? 'Press Space to jump · press again in the air to double jump' : 'Tap to jump · tap again in the air to double jump';
$('howto').textContent = how; $('hint').textContent = finePointer ? 'Space to jump · again in the air to double jump' : 'Tap to jump · tap again in the air to double jump';
resize(); icons(); menuBest(); hud(true); show('sMenu');
requestAnimationFrame(frame);
})();
